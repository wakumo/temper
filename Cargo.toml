[package]
name = "enso-temper"
version = "0.1.0"
edition = "2021"
authors = ["Enso Finance"]
license = "MIT"
description = "Temper is an Ethereum Transaction Simulator"
homepage = "https://github.com/EnsoFinance/temper"
repository = "https://github.com/EnsoFinance/temper"

[dependencies]
anvil = "0.2"
alloy = { version = "1.0.13", features = [
    "eips",
    "json-rpc",
    "node-bindings",
    "rpc-client",
    "rpc-types-debug",
    "rpc-types-trace",
    "provider-http",
    "signer-local"
] }
alloy-chains = "0.2.0"
alloy-eip2930 = "0.2.1"
bytes = "1.10.1"
dashmap = "6.1.0"
dotenvy = "0.15.7"
eyre = "0.6.12"
foundry-config = { git = "https://github.com/foundry-rs/foundry", tag = "v1.3.2", version = "1.3.2" }
foundry-evm = { git = "https://github.com/foundry-rs/foundry", tag = "v1.3.2", version = "1.3.2" }
log = "0.4.27"
pretty_env_logger = "0.5.0"


revm = { version = "23.1.0", default-features = false, features = ["optional_balance_check"] }
revm-primitives = { version = "19.0.0", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth", package = "reth-db", rev = "55f4b0b" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", package = "reth-provider", rev = "55f4b0b" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth", package = "reth-node-types", rev = "55f4b0b" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", package = "reth-chainspec", rev = "55f4b0b" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", package = "reth-node-ethereum", rev = "55f4b0b" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.18.0", features = ["v4", "fast-rng", "serde"] }
warp = { version = "0.4.2", features = ["server", "test"] }
sys-info = "0.9.1"
foundry-fork-db = "0.14"
alloy-evm = "0.7.2"
revm-inspectors = { version = "0.21.0", features = ["std", "js-tracer", "anstyle", "serde"] }
